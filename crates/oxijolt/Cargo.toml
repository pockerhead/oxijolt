[package]
name = "oxijolt"
description = "Safe Rust API for Jolt Physics"
version = "1.4.0+jolt-5.6.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pockerhead/oxijolt"
edition = "2021"
rust-version = "1.88"
keywords = ["physics", "jolt", "gamedev", "simulation", "deterministic"]
categories = ["game-development", "simulation"]
# Tests that build only inside the repository: the real-mesh checks need the unpublished
# `mesh-import` and the models under `assets/`, the character study reads `docs/`.
exclude = ["tests/real_meshes*", "tests/character_study.rs"]

[package.metadata.docs.rs]
features = ["glam032", "glam033", "mint", "debug-renderer"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["prebuilt"]
# Downloads the verified prebuilt native libraries instead of building Jolt (`oxijolt-sys/prebuilt`).
prebuilt = ["oxijolt-sys/prebuilt"]
# Every feature adds to the API except `double-precision`, which turns `Real` into `f64` in every
# signature: only the final application enables it, and libraries built on oxijolt forward it.
double-precision = ["oxijolt-sys/double-precision"]
cross-platform-deterministic = ["oxijolt-sys/cross-platform-deterministic"]
# Debug wireframe of colliders as line data (`PhysicsWorld::debug_lines`); also compiles Jolt's
# debug renderer into the native libraries.
debug-renderer = ["oxijolt-sys/debug-renderer"]
# Compiles Jolt with its debug assertions (`oxijolt-sys/asserts`); a failed assertion prints its
# message and aborts the process.
asserts = ["oxijolt-sys/asserts"]
# Generates the raw bindings with libclang at build time (`oxijolt-sys/bindgen`). A build switch
# outside the semver promise.
bindgen = ["oxijolt-sys/bindgen"]
# `From` conversions between the math types and glam 0.32's `Vec3`, `Quat` and the vector of
# `Real` (`DVec3` in double precision). The name carries glam's version, so a later glam can get
# a feature of its own next to it.
glam032 = ["dep:glam"]
# The same conversions for glam 0.33. Both glam features can be enabled together.
glam033 = ["dep:glam033"]
# `From` conversions between the math types and mint's `Vector3` and `Quaternion`.
mint = ["dep:mint"]

[dependencies]
oxijolt-sys = { version = "1.4.0", path = "../oxijolt-sys", default-features = false }
# The glam versions Bevy uses (0.33 in Bevy 0.20); `std` is glam's math backend and adds
# nothing to the conversions. glam 0.33 has its `f64` types (`DVec3`) behind a feature.
glam = { version = "0.32", optional = true, default-features = false, features = ["std"] }
glam033 = { package = "glam", version = "0.33", optional = true, default-features = false, features = ["std", "f64"] }
mint = { version = "0.5", optional = true, default-features = false }

[dev-dependencies]
rayon = "1.11"
# The real-mesh tests' OBJ and glTF reader; not published, so cargo drops it on publish.
mesh-import = { path = "../mesh-import" }

[[bench]]
name = "budgets"
harness = false
test = false

[[bench]]
name = "character_study"
harness = false
test = false
