name: Release

# Releases a `v<version>` tag: prebuilt native archives, their list in the crate, crates.io.
#   build                  one archive per target and feature subset, from the tagged commit
#   build-wasm             the same for wasm32-unknown-unknown, with wasi-sdk's runtime inside
#   archive-list           writes their sha256 into crates/oxijolt-sys/prebuilt.txt as one commit
#                          on top of the tag, then packages both crates and checks that their
#                          builds take the archives (served locally) without CMake; no write token
#   macos-packages         builds both packages on macOS from the archives, no write token
#   github-release         attaches the archives to the tag's GitHub release
#   record-release-branch  pushes that commit to `release/v<version>`, which a maintainer merges
#                          into main; nothing here writes main
#   crates-io              publish.yml from that commit, which first checks the public assets
# A manual run, or a branch push that changes this file, runs `build`, `build-wasm`,
# `archive-list` and `macos-packages` only and keeps the archives as workflow artifacts. Path
# filters do not apply to tag pushes. A failed tag run resumes with "Re-run failed jobs", or with
# the Publish workflow and ref=release/v<version>.

on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

# Runs of one tag wait for each other, so the release branch is written by one run at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NATIVE_MANIFEST: oxijolt-sys-manifest.txt
  # The archives are built from source; only the package check below takes them.
  JOLTC_PREBUILT: "off"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.meta.outputs.name }}
      safe: ${{ steps.meta.outputs.safe }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The published crate that links joltc, the published crate built on it, and the version
      # without build metadata. `publish = false` packages (test fixtures, tools) are left out.
      - id: meta
        shell: bash
        run: |
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          sys=$(jq -r '[.packages[] | select(.publish != [] and .links == "joltc" and any(.targets[]; .kind == ["lib"]))]
            | if length == 1 then .[0] | "\(.name) \(.version)" else error("expected one package linking joltc") end' "$RUNNER_TEMP/metadata.json")
          name=${sys% *}
          crate_version=${sys#* }
          version=${crate_version%%+*}
          safe=$(jq -r --arg sys "$name" '[.packages[] | select(.publish != [] and any(.dependencies[]; .name == $sys and .kind == null))]
            | if length == 1 then .[0].name else error("expected one package depending on \($sys)") end' "$RUNNER_TEMP/metadata.json")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the crate version $version"
            exit 1
          fi
          echo "$name $version (safe crate $safe)"
          {
            echo "name=$name"
            echo "safe=$safe"
            echo "version=$version"
            echo "crate_version=$crate_version"
          } >> "$GITHUB_OUTPUT"

      # A tag rebuilds the archives and rewrites the release branch only while crates.io has no
      # such version. crates.io keeps the build metadata in the version (`1.0.1+jolt-5.6.0`).
      - name: Not yet on crates.io
        if: github.ref_type == 'tag'
        shell: bash
        env:
          CRATE: ${{ steps.meta.outputs.name }}
          CRATE_VERSION: ${{ steps.meta.outputs.crate_version }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "oxijolt-release (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/$CRATE/${CRATE_VERSION//+/%2B}") || true
          case "$status" in
            404) echo "$CRATE $CRATE_VERSION is not on crates.io yet" ;;
            200) echo "$CRATE $CRATE_VERSION is already on crates.io: use Re-run failed jobs or the Publish workflow with ref=release/v$VERSION"; exit 1 ;;
            *) echo "crates.io check failed (HTTP $status)"; exit 1 ;;
          esac

  build:
    name: ${{ matrix.platform.target }} (${{ matrix.features || 'default' }})
    needs: version
    runs-on: ${{ matrix.platform.os }}
    # Linux builds in an Ubuntu 22.04 container, so the archives need glibc 2.35, not the
    # runner's 2.39.
    container: ${{ matrix.platform.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          # MSVC links only objects from its own toolset or an older one: Visual Studio 2022 keeps
          # the archives usable with 2022 and 2026.
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, container: 'ubuntu:22.04' }
          # Apple silicon on the oldest supported arm64 image; objects of an older Xcode link with
          # newer ones.
          - { os: macos-15, target: aarch64-apple-darwin }
        features:
          - ""
          - double-precision
          - cross-platform-deterministic
          - debug-renderer
          - double-precision,cross-platform-deterministic
          - double-precision,debug-renderer
          - cross-platform-deterministic,debug-renderer
          - double-precision,cross-platform-deterministic,debug-renderer
    defaults:
      run:
        shell: bash
    env:
      CRATE: ${{ needs.version.outputs.name }}
      SAFE_CRATE: ${{ needs.version.outputs.safe }}
      VERSION: ${{ needs.version.outputs.version }}
      RUST_TARGET: ${{ matrix.platform.target }}
      FEATURES: ${{ matrix.features }}
      CONTAINER: ${{ matrix.platform.container }}
    steps:
      # The bare image: git for the checkout, GCC 12 as every C and C++ compiler (the linker
      # driver `cc` included) and CMake 3.22.
      - name: Container packages
        if: matrix.platform.container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl gcc-12 g++-12 cmake make
          for tool in cc gcc; do ln -sf /usr/bin/gcc-12 "/usr/local/bin/$tool"; done
          for tool in c++ g++; do ln -sf /usr/bin/g++-12 "/usr/local/bin/$tool"; done
          # The workspace belongs to the runner's user, the container runs as root.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check pinned commits
        run: |
          joltc=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/joltc)
          jolt=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/JoltPhysics)
          grep -q "\"$joltc\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLTC_COMMIT differs from the gitlink $joltc"; exit 1; }
          grep -q "\"$jolt\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLT_COMMIT differs from the gitlink $jolt"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Pin the Linux compiler
        if: runner.os == 'Linux'
        run: |
          gcc-12 --version
          ldd --version
          cmake --version
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      # cc and CMake read MACOSX_DEPLOYMENT_TARGET, so every object gets minimum 11.0, which the
      # archives must not exceed: it is Rust's minimum for the target.
      - name: Pin the macOS deployment target
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          clang --version
          xcrun --show-sdk-version
          cmake --version
          rust_min=$(env -u MACOSX_DEPLOYMENT_TARGET rustc --print deployment-target --target "$RUST_TARGET")
          echo "Rust's minimum: $rust_min"
          [ "${rust_min#*=}" = 11.0 ] || { echo "the archives must not need a newer macOS than Rust's minimum ($rust_min)"; exit 1; }
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      # A fresh target directory without a cache, so exactly one native prefix exists.
      - name: Build the native library
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/t" cargo build --locked -p "$CRATE" --release --target "$RUST_TARGET" --features "$FEATURES"
          shopt -s nullglob
          dirs=("$RUNNER_TEMP/t/$RUST_TARGET/release/build/$CRATE"-*/out/joltc)
          [ ${#dirs[@]} -eq 1 ] || { echo "expected exactly one native prefix, found ${#dirs[@]}"; exit 1; }
          echo "PREFIX=${dirs[0]}" >> "$GITHUB_ENV"
          tag=${FEATURES:-default}
          echo "ARCHIVE=$CRATE-$VERSION-$RUST_TARGET-${tag//,/+}" >> "$GITHUB_ENV"

      - name: Stage the archive
        run: |
          stage="$RUNNER_TEMP/stage/$ARCHIVE"
          mkdir -p "$stage/licenses"
          cp -r "$PREFIX/lib" "$PREFIX/include" "$PREFIX/$NATIVE_MANIFEST" "$stage/"
          for file in LICENSE-MIT LICENSE-APACHE crates/oxijolt-sys/vendor/joltc/LICENSE crates/oxijolt-sys/vendor/JoltPhysics/LICENSE; do
            [ -f "$file" ] || { echo "missing licence file $file"; exit 1; }
          done
          cp LICENSE-MIT LICENSE-APACHE "$stage/"
          cp crates/oxijolt-sys/vendor/joltc/LICENSE "$stage/licenses/joltc-LICENSE"
          cp crates/oxijolt-sys/vendor/JoltPhysics/LICENSE "$stage/licenses/JoltPhysics-LICENSE"

          # The CPU features Jolt was compiled for, from its CMake options.
          cache="$PREFIX/build/CMakeCache.txt"
          if [ "$RUNNER_OS" = macOS ]; then
            cpu=$(grep -E '^(CMAKE_OSX_ARCHITECTURES|CMAKE_OSX_DEPLOYMENT_TARGET|CROSS_PLATFORM_DETERMINISTIC):[A-Z]*=' "$cache")
            grep -qE '^CMAKE_OSX_ARCHITECTURES:[A-Z]*=arm64$' <<< "$cpu" || { echo "unexpected CPU options:"; echo "$cpu"; exit 1; }
            # The minimum macOS of every object, before PROVENANCE.txt states it.
            bash scripts/check_macos_objects.sh "$MACOSX_DEPLOYMENT_TARGET" "$PREFIX"/lib/*.a
          else
            cpu=$(grep -E '^(USE_(SSE4_1|SSE4_2|AVX|AVX2|AVX512|LZCNT|TZCNT|F16C|FMADD)|CROSS_PLATFORM_DETERMINISTIC):BOOL=' "$cache")
            grep -q '^USE_AVX2:BOOL=ON$' <<< "$cpu" || { echo "unexpected CPU options:"; echo "$cpu"; exit 1; }
            fma=no
            grep -q '^USE_FMADD:BOOL=ON$' <<< "$cpu" && grep -q '^CROSS_PLATFORM_DETERMINISTIC:BOOL=OFF$' <<< "$cpu" && fma=yes
          fi
          compiler=$(sed -nE 's/^set\(CMAKE_CXX_COMPILER_(ID|VERSION) "(.*)"\)$/\2/p' "$PREFIX"/build/CMakeFiles/*/CMakeCXXCompiler.cmake | tr '\n' ' ')
          # `compiler:` gives the archive list its MSVC toolset, `glibc:` its glibc baseline,
          # `macos:` its macOS minimum.
          {
            echo "source: $GITHUB_REPOSITORY@$GITHUB_SHA"
            if [ -n "$CONTAINER" ]; then
              echo "runner image: container $CONTAINER"
            else
              echo "runner image: $ImageOS $ImageVersion"
            fi
            echo "compiler: $compiler"
            if [ "$RUNNER_OS" = Linux ]; then
              echo "glibc: $(getconf GNU_LIBC_VERSION | cut -d' ' -f2)"
            fi
            if [ "$RUNNER_OS" = macOS ]; then
              echo "xcode: $(xcodebuild -version | tr '\n' ' ' | sed 's/ *$//')"
              echo "sdk: $(xcrun --show-sdk-version)"
              echo "macos: $MACOSX_DEPLOYMENT_TARGET"
            fi
            echo "cargo target: $RUST_TARGET"
            echo "features: ${FEATURES:-none}"
            grep -E '^(joltc_commit|jolt_commit|jolt_version|joltc_ext|crt)=' "$PREFIX/$NATIVE_MANIFEST"
            echo "Jolt asserts: OFF"
            echo "CPU options:"
            echo "$cpu"
            if [ "$RUNNER_OS" != macOS ]; then
              echo "FMA instructions used: $fma"
            fi
          } > "$stage/PROVENANCE.txt"
          cat "$stage/PROVENANCE.txt"

      # The object audit must fail on a library with one object built for a newer macOS.
      - name: The object audit refuses a newer object
        if: runner.os == 'macOS' && matrix.features == ''
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          cd "$RUNNER_TEMP/audit"
          echo 'int f(void) { return 1; }' > f.c
          clang -c -arch arm64 -mmacosx-version-min=11.0 f.c -o a11.o
          clang -c -arch arm64 -mmacosx-version-min=12.0 f.c -o a12.o
          ar rcs good.a a11.o
          ar rcs mixed.a a11.o a12.o
          audit="$GITHUB_WORKSPACE/scripts/check_macos_objects.sh"
          bash "$audit" 11.0 good.a
          if bash "$audit" 11.0 mixed.a; then
            echo "the audit accepted an object built for macOS 12.0"
            exit 1
          fi

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          # Relative paths: GNU tar would read a Windows drive letter as a remote host.
          cd "$RUNNER_TEMP/stage"
          if [ "$RUNNER_OS" = macOS ]; then
            # No AppleDouble (`._`) entries: the archive must hold exactly its own files.
            COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf "../dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          else
            tar -czf "../dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          fi
          cd ../dist
          # The same `hash  file` line either way, which `sha256sum -c` reads.
          if command -v sha256sum > /dev/null; then
            sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          else
            shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          fi
          cat "$ARCHIVE.tar.gz.sha256"

      # Builds against the unpacked archive the way a user would, and fails if CMake runs.
      - name: Smoke test the unpacked archive
        run: |
          mkdir -p "$RUNNER_TEMP/u"
          cd "$RUNNER_TEMP/u"
          tar -xzf "../dist/$ARCHIVE.tar.gz"
          cd "$GITHUB_WORKSPACE"
          export JOLTC_LIB_DIR="$RUNNER_TEMP/u/$ARCHIVE"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/s"
          log="$RUNNER_TEMP/smoke.log"
          cargo test --locked -p "$CRATE" --target "$RUST_TARGET" --features "$FEATURES" --test smoke_test -vv > "$log" 2>&1 || { tail -50 "$log"; exit 1; }
          if [[ ",$FEATURES," == *,debug-renderer,* ]]; then
            safe_features=$(echo "$FEATURES" | sed "s/[^,][^,]*/$SAFE_CRATE\/&/g")
            cargo test --locked -p "$SAFE_CRATE" --target "$RUST_TARGET" --features "$safe_features" --test debug_lines -vv >> "$log" 2>&1 || { tail -50 "$log"; exit 1; }
          fi
          grep "test result" "$log"
          cmake_runs=$(grep -c "Build files have been written" "$log" || true)
          [ "$cmake_runs" -eq 0 ] || { echo "the smoke build ran CMake $cmake_runs times"; exit 1; }

      # A release prefix must be refused for a configuration it was not built for.
      - name: Mismatched configuration is refused
        if: matrix.features == ''
        run: |
          cp -r "$RUNNER_TEMP/u/$ARCHIVE" "$RUNNER_TEMP/m"
          sed 's/^double_precision=OFF$/double_precision=ON/' "$RUNNER_TEMP/m/$NATIVE_MANIFEST" > "$RUNNER_TEMP/m/$NATIVE_MANIFEST.tmp"
          mv "$RUNNER_TEMP/m/$NATIVE_MANIFEST.tmp" "$RUNNER_TEMP/m/$NATIVE_MANIFEST"
          grep -q '^double_precision=ON$' "$RUNNER_TEMP/m/$NATIVE_MANIFEST"
          log="$RUNNER_TEMP/mismatch.log"
          if JOLTC_LIB_DIR="$RUNNER_TEMP/m" CARGO_TARGET_DIR="$RUNNER_TEMP/s" cargo check --locked -p "$CRATE" --target "$RUST_TARGET" > "$log" 2>&1; then
            echo "the mismatched prefix was accepted"
            exit 1
          fi
          grep "built for a different configuration" "$log"

      # Uploaded from a path relative to the workspace: inside the container `runner.temp` names
      # the host's directory, and the artifact then kept the container path and lost the .sha256.
      - name: Collect the artifact
        run: |
          mkdir -p artifact
          cp "$RUNNER_TEMP/dist/$ARCHIVE.tar.gz" "$RUNNER_TEMP/dist/$ARCHIVE.tar.gz.sha256" artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: artifact/
          if-no-files-found: error

  # wasm32-unknown-unknown archives, built with the wasi-sdk of CI's wasm job. Each bundles the
  # SDK's runtime libraries and their licences, so a build that takes it needs neither CMake nor
  # wasi-sdk. scripts/build_wasm_archive.sh builds, packs and smoke tests one archive (the raw
  # fixture in Node, without the SDK); it runs the same way locally.
  build-wasm:
    name: wasm32-unknown-unknown (${{ matrix.features || 'default' }})
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - double-precision
          - cross-platform-deterministic
          - debug-renderer
          - double-precision,cross-platform-deterministic
          - double-precision,debug-renderer
          - cross-platform-deterministic,debug-renderer
          - double-precision,cross-platform-deterministic,debug-renderer
    defaults:
      run:
        shell: bash
    env:
      CRATE: ${{ needs.version.outputs.name }}
      FEATURES: ${{ matrix.features }}
      # The pin of ci.yml's wasm job; the licences in scripts/build_wasm_archive.sh are this SDK's.
      WASI_SDK_VERSION: "34.0"
      # GitHub's digest of the release asset wasi-sdk-34.0-x86_64-linux.tar.gz.
      WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check pinned commits
        run: |
          joltc=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/joltc)
          jolt=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/JoltPhysics)
          grep -q "\"$joltc\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLTC_COMMIT differs from the gitlink $joltc"; exit 1; }
          grep -q "\"$jolt\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLT_COMMIT differs from the gitlink $jolt"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install wasi-sdk
        run: |
          archive="wasi-sdk-$WASI_SDK_VERSION-x86_64-linux.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/$archive"
          echo "$WASI_SDK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-$WASI_SDK_VERSION-x86_64-linux" >> "$GITHUB_ENV"

      # Uploaded from the workspace, like the native archives.
      - name: Build, pack and smoke test the archive
        run: |
          bash scripts/build_wasm_archive.sh "$FEATURES" artifact
          archives=(artifact/*.tar.gz)
          [ ${#archives[@]} -eq 1 ] || { echo "expected one archive, found ${#archives[@]}"; exit 1; }
          name=$(basename "${archives[0]}" .tar.gz)
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: artifact/
          if-no-files-found: error

  # The release commit Y: the tagged commit X plus the archive list. This job runs build scripts
  # (cargo package), so it gets no write token and keeps no credentials; it hands Y on as a git
  # bundle.
  archive-list:
    name: Archive list
    needs: [version, build, build-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CRATE: ${{ needs.version.outputs.name }}
      SAFE_CRATE: ${{ needs.version.outputs.safe }}
      VERSION: ${{ needs.version.outputs.version }}
      LIST: crates/${{ needs.version.outputs.name }}/prebuilt.txt
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dist
          pattern: ${{ needs.version.outputs.name }}-*
          merge-multiple: true

      # The full release set: 4 targets x 8 feature subsets, every archive built from this commit.
      - name: Write the list
        run: |
          cargo run --locked -p xtask -- prebuilt-list --dist "$RUNNER_TEMP/dist" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" --commit "$GITHUB_SHA"
          cat "$LIST"

      - name: Commit the list
        id: commit
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Record the release archives of $CRATE $VERSION" -- "$LIST"
          changed=$(git diff --name-only "$GITHUB_SHA" HEAD)
          [ "$changed" = "$LIST" ] || { echo "the release commit changes more than $LIST:"; echo "$changed"; exit 1; }
          [ "$(git rev-parse HEAD^)" = "$GITHUB_SHA" ] || { echo "the release commit is not a child of $GITHUB_SHA"; exit 1; }
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --stat

      # The crates as they will be published, each built from its package with the build
      # script's download path: the archives come from a local mirror of the release, CMake and a
      # C++ compiler are missing, and `require` makes any fallback an error. This also proves that
      # the packaged native sources have the fingerprint of the list. The second round builds
      # them for wasm32-unknown-unknown, with no wasi-sdk on the runner.
      - name: Packages take the archives
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/dist" > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl -s --retry 20 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8765/
          for target in "" wasm32-unknown-unknown; do
            log="$RUNNER_TEMP/package-${target:-host}.log"
            env -u JOLTC_LIB_DIR -u WASI_SDK_PATH JOLTC_PREBUILT=require JOLTC_PREBUILT_URL=http://127.0.0.1:8765 \
              CMAKE=oxijolt-no-cmake CXX=oxijolt-no-cxx \
              cargo package --locked -p "$CRATE" -p "$SAFE_CRATE" ${target:+--target "$target"} -vv > "$log" 2>&1 || { tail -80 "$log"; exit 1; }
            grep "using the prebuilt archive" "$log"
            used=$(grep -c "using the prebuilt archive" "$log" || true)
            [ "$used" -ge 2 ] || { echo "expected both verify builds to take the archive, found $used"; exit 1; }
          done
          grep '"GET ' "$RUNNER_TEMP/server.log"

      - name: Bundle the release commit
        run: |
          mkdir -p "$RUNNER_TEMP/archive-list"
          git bundle create "$RUNNER_TEMP/archive-list/y.bundle" "$GITHUB_SHA..HEAD"
          cp "$LIST" "$RUNNER_TEMP/archive-list/prebuilt.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-list
          path: |
            ${{ runner.temp }}/archive-list/y.bundle
            ${{ runner.temp }}/archive-list/prebuilt.txt
          if-no-files-found: error

  # The same package check on a Mac: the release commit from the bundle, its packages built
  # with the archives served locally, without CMake. Runs build scripts, so no write token.
  macos-packages:
    name: Packages take the archives (macOS)
    needs: [version, archive-list]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CRATE: ${{ needs.version.outputs.name }}
      SAFE_CRATE: ${{ needs.version.outputs.safe }}
      RELEASE_COMMIT: ${{ needs.archive-list.outputs.ref }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dist
          pattern: ${{ needs.version.outputs.name }}-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: archive-list
          path: ${{ runner.temp }}/archive-list

      - name: Check out the release commit
        run: |
          bundle="$RUNNER_TEMP/archive-list/y.bundle"
          git bundle verify "$bundle"
          git fetch "$bundle" HEAD
          fetched=$(git rev-parse FETCH_HEAD)
          [ "$fetched" = "$RELEASE_COMMIT" ] || { echo "the bundle holds $fetched, not $RELEASE_COMMIT"; exit 1; }
          git checkout --detach "$RELEASE_COMMIT"
          git submodule update --init

      - name: Packages take the archives
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/dist" > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl -s --retry 20 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8765/
          log="$RUNNER_TEMP/package.log"
          env -u JOLTC_LIB_DIR JOLTC_PREBUILT=require JOLTC_PREBUILT_URL=http://127.0.0.1:8765 \
            CMAKE=oxijolt-no-cmake CXX=oxijolt-no-cxx \
            cargo package --locked -p "$CRATE" -p "$SAFE_CRATE" -vv > "$log" 2>&1 || { tail -80 "$log"; exit 1; }
          grep "using the prebuilt archive" "$log"
          used=$(grep -c "using the prebuilt archive" "$log" || true)
          [ "$used" -ge 2 ] || { echo "expected both verify builds to take the archive, found $used"; exit 1; }
          grep '"GET ' "$RUNNER_TEMP/server.log"

  github-release:
    name: GitHub release
    needs: [version, archive-list, macos-packages]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ${{ needs.version.outputs.name }}-*
          merge-multiple: true

      - name: Verify the archives
        working-directory: dist
        run: |
          shopt -s nullglob
          archives=(*.tar.gz)
          sums=(*.tar.gz.sha256)
          [ ${#archives[@]} -eq 32 ] && [ ${#sums[@]} -eq 32 ] || { echo "expected 32 archives and 32 checksums, found ${#archives[@]} and ${#sums[@]}"; exit 1; }
          sha256sum -c "${sums[@]}"

      - name: Write the release notes
        run: |
          cat > notes.md <<'EOF'
          Prebuilt joltc and Jolt Physics static libraries, one archive per target and feature subset
          (`default`, or the enabled features joined by `+`). The build script of this version
          downloads the archive that matches the build and checks it against the sha256 recorded in
          the crate (`prebuilt.txt`); it builds from source when none matches. `JOLTC_LIB_DIR` still
          takes an unpacked archive, checked against the crate features. Each `.sha256` file holds the
          archive's checksum.

          - Targets: `x86_64-pc-windows-msvc`, `x86_64-unknown-linux-gnu`, `aarch64-apple-darwin` and
            `wasm32-unknown-unknown`.
          - Windows: built with Visual Studio 2022 and the dynamic MSVC runtime (`/MD`). Link with that
            MSVC toolset or a newer one (the version is in `PROVENANCE.txt`); not usable with `crt-static`.
          - Linux: built with GCC 12 on Ubuntu 22.04; needs glibc 2.35 or newer and a compatible
            libstdc++ at run time.
          - macOS (Apple silicon): built on the `macos-15` runner with its Xcode (versions in
            `PROVENANCE.txt`) for macOS 11.0 or newer; the build script refuses it for an older
            deployment target. Intel Macs build from source.
          - wasm32-unknown-unknown: built with wasi-sdk 34.0 and Rust's rust-lld; each archive bundles
            the SDK's libc++, libc++abi, wasi-libc and clang_rt.builtins with their licences in
            `licenses/`, so a build needs neither wasi-sdk nor CMake. Needs Rust 1.91 or newer.
          - Jolt assertions are off.
          - CPU on x86_64: AVX2, BMI1, LZCNT, POPCNT and F16C; builds without `cross-platform-deterministic`
            also use FMA. On Apple silicon: no extra CPU features. `PROVENANCE.txt` in each archive lists
            the options used.

          Other targets and configurations (for example `asserts`) build from source.
          EOF

      - name: Attach to the release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*.tar.gz dist/*.tar.gz.sha256
          fi

  # Force is safe here: the version job proved the version is not published, runs of one tag are
  # serialized, and nothing but this run refers to an unpublished release commit.
  record-release-branch:
    name: Release branch
    needs: [version, archive-list, github-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_COMMIT: ${{ needs.archive-list.outputs.ref }}
      LIST: crates/${{ needs.version.outputs.name }}/prebuilt.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: archive-list
          path: ${{ runner.temp }}/archive-list

      - name: Push release/v${{ needs.version.outputs.version }}
        run: |
          bundle="$RUNNER_TEMP/archive-list/y.bundle"
          git bundle verify "$bundle"
          git fetch "$bundle" HEAD
          fetched=$(git rev-parse FETCH_HEAD)
          [ "$fetched" = "$RELEASE_COMMIT" ] || { echo "the bundle holds $fetched, not $RELEASE_COMMIT"; exit 1; }
          [ "$(git rev-parse "$RELEASE_COMMIT^")" = "$GITHUB_SHA" ] || { echo "$RELEASE_COMMIT is not a child of $GITHUB_SHA"; exit 1; }
          changed=$(git diff --name-only "$GITHUB_SHA" "$RELEASE_COMMIT")
          [ "$changed" = "$LIST" ] || { echo "the release commit changes more than $LIST:"; echo "$changed"; exit 1; }
          git push --force origin "$RELEASE_COMMIT:refs/heads/release/v$VERSION"

  crates-io:
    name: crates.io
    needs: [archive-list, record-release-branch]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.archive-list.outputs.ref }}
    secrets: inherit
