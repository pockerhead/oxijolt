name: CI

on:
  push:
  pull_request:

# CI builds Jolt from source (once per cache key) and does not download release archives; the
# prebuilt download has its own step against a local server.
env:
  JOLTC_PREBUILT: "off"

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.features || 'default' }})
    runs-on: ${{ matrix.os }}
    # A backstop in case a runner attaches a debugger to a failed assertion's fail-fast.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        features: ["", "cross-platform-deterministic", "double-precision", "debug-renderer", "asserts"]
        # These entries add feature_args to the rows of both operating systems.
        # The debug renderer is a feature of the safe crate (it forwards to oxijolt-sys);
        # enabling only the sys feature would leave the debug module and its tests unbuilt.
        include:
          - features: debug-renderer
            feature_args: --features oxijolt/debug-renderer
          # Jolt's debug assertions through the safe crate's feature (it forwards to
          # oxijolt-sys), so a failed assertion aborts with its message. The native cache key
          # below contains matrix.features, so this leg builds and caches its own library.
          - features: asserts
            feature_args: --features oxijolt/asserts
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      NATIVE_MANIFEST: oxijolt-sys-manifest.txt
      FEATURE_ARGS: ${{ matrix.feature_args || (matrix.features && format('--features oxijolt-sys/{0}', matrix.features)) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.features || 'default' }}

      # The native cache key and the build.rs manifest both rely on these
      # constants matching the submodule gitlinks.
      - name: Check pinned commits
        id: pins
        run: |
          joltc=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/joltc)
          jolt=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/JoltPhysics)
          grep -q "\"$joltc\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLTC_COMMIT differs from the gitlink $joltc"; exit 1; }
          grep -q "\"$jolt\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLT_COMMIT differs from the gitlink $jolt"; exit 1; }
          echo "joltc=$joltc" >> "$GITHUB_OUTPUT"
          echo "jolt=$jolt" >> "$GITHUB_OUTPUT"

      - name: Restore native library
        id: native
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/joltc-prefix
          key: joltc-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.joltc }}-${{ steps.pins.outputs.jolt }}-${{ matrix.features || 'default' }}-${{ hashFiles('crates/oxijolt-sys/native/**', 'crates/oxijolt-sys/build.rs', 'crates/oxijolt-sys/build/**') }}

      - name: Build native library
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          cargo build --workspace --exclude playground --exclude comparison $FEATURE_ARGS
          shopt -s nullglob
          dirs=(target/debug/build/oxijolt-sys-*/out/joltc)
          [ ${#dirs[@]} -eq 1 ] || { echo "expected exactly one native prefix, found ${#dirs[@]}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/joltc-prefix"
          cp -r "${dirs[0]}/lib" "${dirs[0]}/include" "${dirs[0]}/$NATIVE_MANIFEST" "$RUNNER_TEMP/joltc-prefix/"

      # Every later step links the cached prefix, so each run also exercises
      # the JOLTC_LIB_DIR validation. A manifest mismatch means the cache key
      # is wrong; fix the key rather than falling back to CMake.
      - name: Use the native library
        run: echo "JOLTC_LIB_DIR=$RUNNER_TEMP/joltc-prefix" >> "$GITHUB_ENV"

      # The build script's release-archive path: the native prefix packed as an archive and
      # served on 127.0.0.1, every fallback in auto and require mode, the cache. The xtask tests
      # cover the list, the unpacking and curl; Linux also runs them in the bindings job.
      - name: Prebuilt download
        if: matrix.features == ''
        run: bash scripts/check_prebuilt_download.sh "$JOLTC_LIB_DIR"
      - name: xtask tests
        if: matrix.features == '' && runner.os == 'Windows'
        run: cargo test --locked -p xtask

      # Without the feature, neither Jolt nor joltc may contain the debug renderer.
      - name: Debug renderer compiled only with its feature
        run: |
          joltc=no
          jolt=no
          if [ "$RUNNER_OS" = Windows ]; then
            grep -q -a JPH_DebugRenderer_Create "$JOLTC_LIB_DIR"/lib/joltc*.lib && joltc=yes
            grep -q -a DrawGeometry@DebugRendererSimple "$JOLTC_LIB_DIR"/lib/Jolt.lib && jolt=yes
          else
            nm --defined-only "$JOLTC_LIB_DIR"/lib/libjoltc*.a > "$RUNNER_TEMP/joltc.nm"
            nm -C --defined-only "$JOLTC_LIB_DIR"/lib/libJolt.a > "$RUNNER_TEMP/jolt.nm"
            # Mach-O prefixes C symbols with an underscore.
            grep -q -E ' T _?JPH_DebugRenderer_Create$' "$RUNNER_TEMP/joltc.nm" && joltc=yes
            grep -q 'DebugRendererSimple::DrawGeometry' "$RUNNER_TEMP/jolt.nm" && jolt=yes
          fi
          expected=no; [ "${{ matrix.features }}" = debug-renderer ] && expected=yes
          [ "$joltc" = "$expected" ] && [ "$jolt" = "$expected" ] || { echo "debug renderer joltc=$joltc jolt=$jolt expected=$expected"; exit 1; }

      # Jolt compiled with its x86-64 instruction-set flags (AVX2, and FMA unless the build is
      # cross-platform deterministic). A Jolt built for plain x86-64 has almost no ymm registers.
      - name: Jolt compiled for AVX2
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          objdump -d "$JOLTC_LIB_DIR"/lib/libJolt.a > "$RUNNER_TEMP/jolt.asm"
          ymm=$(grep -c ymm "$RUNNER_TEMP/jolt.asm" || true)
          fma=$(grep -c vfmadd "$RUNNER_TEMP/jolt.asm" || true)
          echo "ymm=$ymm vfmadd=$fma"
          [ "$ymm" -gt 1000 ] || { echo "Jolt was compiled without AVX2"; exit 1; }
          if [ "${{ matrix.features }}" = cross-platform-deterministic ]; then
            [ "$fma" -eq 0 ] || { echo "a cross-platform deterministic Jolt uses FMA"; exit 1; }
          else
            [ "$fma" -gt 0 ] || { echo "Jolt was compiled without FMA"; exit 1; }
          fi

      # The playground has a job of its own below.
      - run: cargo build --workspace --exclude playground --exclude comparison --all-targets $FEATURE_ARGS
      - run: cargo test --workspace --exclude playground --exclude comparison $FEATURE_ARGS
      - run: cargo run -p oxijolt --example hello_world $FEATURE_ARGS
      - run: cargo clippy --workspace --exclude playground --exclude comparison --all-targets $FEATURE_ARGS -- -D warnings
      - run: cargo doc --workspace --exclude playground --exclude comparison --no-deps $FEATURE_ARGS
      # The build-time generator still works against the same native library.
      - name: Generate the bindings at build time
        if: matrix.features == '' || matrix.features == 'double-precision' || matrix.features == 'debug-renderer'
        run: cargo check -p oxijolt-sys --features "oxijolt-sys/bindgen${{ matrix.features && format(',oxijolt-sys/{0}', matrix.features) || '' }}"
      # The glam and mint conversions in single and double precision, each feature alone and
      # all together. No glam version and no mint may be in the dependency graph without its
      # feature.
      - name: glam and mint conversions
        if: matrix.features == '' || matrix.features == 'double-precision'
        run: |
          if cargo tree -p oxijolt -e normal --prefix none $FEATURE_ARGS | grep -E '^(glam|mint) '; then
            echo "glam or mint is in the dependency graph without its feature"; exit 1
          fi
          cargo clippy -p oxijolt --lib $FEATURE_ARGS --features oxijolt/glam032 -- -D warnings
          cargo clippy -p oxijolt --lib $FEATURE_ARGS --features oxijolt/glam033 -- -D warnings
          cargo clippy -p oxijolt --lib $FEATURE_ARGS --features oxijolt/mint -- -D warnings
          interop="--features oxijolt/glam032,oxijolt/glam033,oxijolt/mint"
          cargo clippy --workspace --exclude playground --exclude comparison --all-targets $FEATURE_ARGS $interop -- -D warnings
          cargo test -p oxijolt --lib $FEATURE_ARGS $interop interop
          cargo test -p oxijolt --doc $FEATURE_ARGS $interop
          cargo doc -p oxijolt --no-deps $FEATURE_ARGS $interop

  # The playground's scenes without a window: its tests, every scene's script with 1 and 4
  # worker threads (which must print the same digests), and clippy. Its native library is the
  # test job's of the same features, so the two jobs share the cache entries.
  playground:
    name: playground ${{ matrix.os }} (${{ matrix.features || 'default' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        features: ["", "debug-renderer", "asserts"]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      NATIVE_MANIFEST: oxijolt-sys-manifest.txt
      FEATURE_ARGS: ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: playground-${{ matrix.os }}-${{ matrix.features || 'default' }}

      - name: Check pinned commits
        id: pins
        run: |
          joltc=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/joltc)
          jolt=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/JoltPhysics)
          grep -q "\"$joltc\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLTC_COMMIT differs from the gitlink $joltc"; exit 1; }
          grep -q "\"$jolt\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLT_COMMIT differs from the gitlink $jolt"; exit 1; }
          echo "joltc=$joltc" >> "$GITHUB_OUTPUT"
          echo "jolt=$jolt" >> "$GITHUB_OUTPUT"

      - name: Restore native library
        id: native
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/joltc-prefix
          key: joltc-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.joltc }}-${{ steps.pins.outputs.jolt }}-${{ matrix.features || 'default' }}-${{ hashFiles('crates/oxijolt-sys/native/**', 'crates/oxijolt-sys/build.rs', 'crates/oxijolt-sys/build/**') }}

      # Built in a target directory of its own, so the cached one cannot add a second prefix.
      - name: Build native library
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/native" cargo build -p playground --no-default-features $FEATURE_ARGS
          shopt -s nullglob
          dirs=("$RUNNER_TEMP"/native/debug/build/oxijolt-sys-*/out/joltc)
          [ ${#dirs[@]} -eq 1 ] || { echo "expected exactly one native prefix, found ${#dirs[@]}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/joltc-prefix"
          cp -r "${dirs[0]}/lib" "${dirs[0]}/include" "${dirs[0]}/$NATIVE_MANIFEST" "$RUNNER_TEMP/joltc-prefix/"

      - name: Use the native library
        run: echo "JOLTC_LIB_DIR=$RUNNER_TEMP/joltc-prefix" >> "$GITHUB_ENV"

      - run: cargo test --locked -p playground --no-default-features $FEATURE_ARGS
      # The default length covers every scene's whole script, so both runs check every milestone.
      - name: Every scene headless with 1 and 4 worker threads
        run: |
          run="cargo run --locked -p playground --no-default-features $FEATURE_ARGS --"
          $run --headless --scene all --threads 1 > "$RUNNER_TEMP/one.txt"
          $run --headless --scene all --threads 4 > "$RUNNER_TEMP/four.txt"
          cat "$RUNNER_TEMP/one.txt"
          diff "$RUNNER_TEMP/one.txt" "$RUNNER_TEMP/four.txt"
      - run: cargo clippy --locked -p playground --all-targets --no-default-features $FEATURE_ARGS -- -D warnings
      # The window with the default features (window and debug renderer), compiled only: the
      # runners have no GPU. Linux would need the X11 and GL development packages.
      - name: Window build
        if: runner.os == 'Windows' && matrix.features == 'debug-renderer'
        run: cargo clippy --locked -p playground --all-targets -- -D warnings

  # The engine comparison (benches/comparison): clippy and tests with every engine, a short
  # validation matrix of moving scenes with 1 and 4 threads (Jolt's digests must be identical),
  # each engine's hello binary built and run alone, and the campaign script's tests against a fake
  # harness. The full benchmark runs by hand (docs/comparison.md). Its native library is the test
  # job's default one.
  # Not on macOS: the harness reads CPU time and memory only from Windows and Linux (src/os.rs).
  comparison:
    name: comparison ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      NATIVE_MANIFEST: oxijolt-sys-manifest.txt
      ENGINES: --features jolt,rapier,avian,parallel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: comparison-${{ matrix.os }}

      - name: Check pinned commits
        id: pins
        run: |
          joltc=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/joltc)
          jolt=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/JoltPhysics)
          grep -q "\"$joltc\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLTC_COMMIT differs from the gitlink $joltc"; exit 1; }
          grep -q "\"$jolt\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLT_COMMIT differs from the gitlink $jolt"; exit 1; }
          echo "joltc=$joltc" >> "$GITHUB_OUTPUT"
          echo "jolt=$jolt" >> "$GITHUB_OUTPUT"

      - name: Restore native library
        id: native
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/joltc-prefix
          key: joltc-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.joltc }}-${{ steps.pins.outputs.jolt }}-default-${{ hashFiles('crates/oxijolt-sys/native/**', 'crates/oxijolt-sys/build.rs', 'crates/oxijolt-sys/build/**') }}

      # Built in a target directory of its own, so the cached one cannot add a second prefix.
      - name: Build native library
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/native" cargo build -p oxijolt-sys
          shopt -s nullglob
          dirs=("$RUNNER_TEMP"/native/debug/build/oxijolt-sys-*/out/joltc)
          [ ${#dirs[@]} -eq 1 ] || { echo "expected exactly one native prefix, found ${#dirs[@]}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/joltc-prefix"
          cp -r "${dirs[0]}/lib" "${dirs[0]}/include" "${dirs[0]}/$NATIVE_MANIFEST" "$RUNNER_TEMP/joltc-prefix/"

      - name: Use the native library
        run: echo "JOLTC_LIB_DIR=$RUNNER_TEMP/joltc-prefix" >> "$GITHUB_ENV"

      - run: cargo clippy --locked -p comparison --all-targets $ENGINES -- -D warnings
      - run: cargo test --locked -p comparison $ENGINES
      - name: Validation matrix, Jolt identical with 1 and 4 threads
        run: |
          cargo run --locked -p comparison $ENGINES -- all --mode validate \
            --scenes fixture_spherical,fixture_revolute,capsules --variants jolt,rapier-par,avian-par \
            --threads 1,4 --profiles matched --steps 60 --require-identical jolt \
            --out "$RUNNER_TEMP/validate"
          cat "$RUNNER_TEMP/validate/summary.md"
      - name: Each engine's hello binary alone
        run: |
          for engine in jolt rapier avian; do
            cargo run --locked -p comparison --no-default-features --features $engine --bin hello-$engine
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Campaign script tests
        run: python -m unittest discover -s benches/comparison/scripts -v

  # The real-mesh checks on every model of assets/models/models.tsv, the large downloaded ones
  # included (scripts/fetch_models.py, cached by the table's hash), with and without Jolt's
  # assertions: a failed assertion aborts the test process and a dropped-area or other threshold
  # breach fails a test. Its native library is the test job's of the same features.
  real-meshes:
    name: real meshes ${{ matrix.os }} (${{ matrix.features || 'default' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        features: ["", "asserts"]
        include:
          - features: asserts
            feature_args: --features oxijolt/asserts
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      NATIVE_MANIFEST: oxijolt-sys-manifest.txt
      FEATURE_ARGS: ${{ matrix.feature_args || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: Swatinem/rust-cache@v2
        with:
          key: real-meshes-${{ matrix.os }}-${{ matrix.features || 'default' }}

      - name: Check pinned commits
        id: pins
        run: |
          joltc=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/joltc)
          jolt=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/JoltPhysics)
          grep -q "\"$joltc\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLTC_COMMIT differs from the gitlink $joltc"; exit 1; }
          grep -q "\"$jolt\"" crates/oxijolt-sys/build.rs || { echo "build.rs JOLT_COMMIT differs from the gitlink $jolt"; exit 1; }
          echo "joltc=$joltc" >> "$GITHUB_OUTPUT"
          echo "jolt=$jolt" >> "$GITHUB_OUTPUT"

      - name: Restore native library
        id: native
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/joltc-prefix
          key: joltc-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.joltc }}-${{ steps.pins.outputs.jolt }}-${{ matrix.features || 'default' }}-${{ hashFiles('crates/oxijolt-sys/native/**', 'crates/oxijolt-sys/build.rs', 'crates/oxijolt-sys/build/**') }}

      - name: Build native library
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/native" cargo build -p oxijolt $FEATURE_ARGS
          shopt -s nullglob
          dirs=("$RUNNER_TEMP"/native/debug/build/oxijolt-sys-*/out/joltc)
          [ ${#dirs[@]} -eq 1 ] || { echo "expected exactly one native prefix, found ${#dirs[@]}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/joltc-prefix"
          cp -r "${dirs[0]}/lib" "${dirs[0]}/include" "${dirs[0]}/$NATIVE_MANIFEST" "$RUNNER_TEMP/joltc-prefix/"

      - name: Use the native library
        run: echo "JOLTC_LIB_DIR=$RUNNER_TEMP/joltc-prefix" >> "$GITHUB_ENV"

      - name: Restore the downloaded models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: models-${{ hashFiles('assets/models/models.tsv') }}

      # Downloads what the cache lacks and checks every file's SHA-256, cached ones included.
      - name: Fetch the models
        run: python scripts/fetch_models.py --out "$RUNNER_TEMP/models"

      - name: Real-mesh checks
        run: |
          OXIJOLT_MODELS="$RUNNER_TEMP/models" cargo test --locked -p oxijolt $FEATURE_ARGS \
            --test real_meshes --test real_meshes_downloaded --test real_meshes_determinism \
            -- --include-ignored --nocapture

  # The committed bindings must equal the generator's output with the pinned LLVM 18.
  bindings:
    name: Committed bindings
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Use LLVM 18
        run: |
          ls /usr/lib/llvm-18/lib/libclang.so*
          clang-18 --version | grep -q 'version 18\.' || { clang-18 --version; exit 1; }
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"
          echo "CLANG_PATH=/usr/bin/clang-18" >> "$GITHUB_ENV"
      - run: cargo xtask bindings --check --out "$RUNNER_TEMP/bindings"
      - run: cargo test --locked -p xtask
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bindings
          path: ${{ runner.temp }}/bindings
          if-no-files-found: ignore

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The oldest Rust both crates declare (`rust-version`), checked with every target. The native
  # library is the test job's default one on Linux, so the two jobs share the cache entry.
  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      NATIVE_MANIFEST: oxijolt-sys-manifest.txt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check pinned commits
        id: pins
        run: |
          joltc=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/joltc)
          jolt=$(git rev-parse HEAD:crates/oxijolt-sys/vendor/JoltPhysics)
          echo "joltc=$joltc" >> "$GITHUB_OUTPUT"
          echo "jolt=$jolt" >> "$GITHUB_OUTPUT"

      - name: Restore native library
        id: native
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/joltc-prefix
          key: joltc-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.joltc }}-${{ steps.pins.outputs.jolt }}-default-${{ hashFiles('crates/oxijolt-sys/native/**', 'crates/oxijolt-sys/build.rs', 'crates/oxijolt-sys/build/**') }}

      - name: Build native library
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/native" cargo build -p oxijolt-sys
          shopt -s nullglob
          dirs=("$RUNNER_TEMP"/native/debug/build/oxijolt-sys-*/out/joltc)
          [ ${#dirs[@]} -eq 1 ] || { echo "expected exactly one native prefix, found ${#dirs[@]}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/joltc-prefix"
          cp -r "${dirs[0]}/lib" "${dirs[0]}/include" "${dirs[0]}/$NATIVE_MANIFEST" "$RUNNER_TEMP/joltc-prefix/"

      - name: Use the native library
        run: echo "JOLTC_LIB_DIR=$RUNNER_TEMP/joltc-prefix" >> "$GITHUB_ENV"

      - run: cargo check --workspace --exclude playground --exclude comparison --all-targets
