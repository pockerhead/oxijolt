# Publishes oxijolt-sys and then oxijolt to crates.io from a release commit: the tagged commit
# plus its archive list (crates/oxijolt-sys/prebuilt.txt). The Release workflow calls this on a
# tag. Start it by hand only to resume a failed upload, with ref=release/v<version>. A crate
# already on crates.io is skipped; an oxijolt-sys published with another archive list fails the
# run, and the fix is a new version. Linux and macOS build the packages from the real download
# before anything is uploaded, Linux also for wasm32-unknown-unknown. Needs a crates.io API token
# in the repository secret CARGO_REGISTRY_TOKEN.
name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The release commit, for example release/v1.2.0
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: The release commit
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # Both crates built from their packages on a Mac, downloading the Apple silicon archive from
  # the GitHub release over TLS; CMake and a C++ compiler are missing and any fallback is an
  # error. No secrets.
  verify-macos:
    name: Verify the packages (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify the packages
        run: |
          log="$RUNNER_TEMP/package.log"
          env -u JOLTC_LIB_DIR JOLTC_PREBUILT=require CMAKE=oxijolt-no-cmake CXX=oxijolt-no-cxx \
            cargo package --locked -p oxijolt-sys -p oxijolt -vv > "$log" 2>&1 || { tail -80 "$log"; exit 1; }
          grep "using the prebuilt archive" "$log"
          used=$(grep -c "using the prebuilt archive" "$log" || true)
          [ "$used" -ge 2 ] || { echo "expected both verify builds to take the archive, found $used"; exit 1; }

  publish:
    name: Publish
    needs: verify-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      LIST: crates/oxijolt-sys/prebuilt.txt
      USER_AGENT: oxijolt-release (github.com/${{ github.repository }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The commit must be the tag's commit plus the list, and every public asset must hash to
      # the list's line, before anything is uploaded.
      - name: Validate the release commit
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "oxijolt-sys") | .version')
          version=${crate_version%%+*}
          tag_commit=$(git rev-parse -q --verify "refs/tags/v$version^{commit}") || { echo "no tag v$version"; exit 1; }
          [ "$(git rev-parse HEAD^)" = "$tag_commit" ] || { echo "the parent of $(git rev-parse HEAD) is not v$version ($tag_commit)"; exit 1; }
          changed=$(git diff --name-only HEAD^ HEAD)
          [ "$changed" = "$LIST" ] || { echo "the release commit changes more than $LIST:"; echo "$changed"; exit 1; }
          grep -qxF "version=$version" "$LIST" || { echo "$LIST is not for version $version"; exit 1; }
          archives=$(grep -c '^archive=' "$LIST" || true)
          [ "$archives" -eq 32 ] || { echo "$LIST lists $archives archives, expected 32"; exit 1; }
          url=$(sed -n 's/^url=//p' "$LIST")
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          while read -r name; do
            curl -fsSL --retry 3 --proto '=https' -A "$USER_AGENT" -o "$assets/$name.tar.gz" "$url/$name.tar.gz"
          done < <(sed -n 's/^archive=\([^ ]*\) .*/\1/p' "$LIST")
          cargo xtask prebuilt-list --check "$LIST" --dist "$assets"
          echo "CRATE_VERSION=$crate_version" >> "$GITHUB_ENV"

      # Each crate built from its package, downloading its archive from the GitHub release over
      # TLS, for Linux and for wasm32-unknown-unknown; CMake, a C++ compiler and wasi-sdk are
      # missing and any fallback is an error.
      - name: Verify the packages
        run: |
          for target in "" wasm32-unknown-unknown; do
            log="$RUNNER_TEMP/package-${target:-host}.log"
            env -u JOLTC_LIB_DIR -u WASI_SDK_PATH JOLTC_PREBUILT=require CMAKE=oxijolt-no-cmake CXX=oxijolt-no-cxx \
              cargo package --locked -p oxijolt-sys -p oxijolt ${target:+--target "$target"} -vv > "$log" 2>&1 || { tail -80 "$log"; exit 1; }
            grep "using the prebuilt archive" "$log"
            used=$(grep -c "using the prebuilt archive" "$log" || true)
            [ "$used" -ge 2 ] || { echo "expected both verify builds to take the archive, found $used"; exit 1; }
          done

      # The packages were verified above, so the uploads skip the second build. crates.io keeps
      # the build metadata in the version (`1.0.1+jolt-5.6.0`).
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          endpoint() { echo "https://crates.io/api/v1/crates/$1/${CRATE_VERSION//+/%2B}"; }
          # 200 or 404, retried on anything else.
          status_of() {
            local status
            for attempt in 1 2 3; do
              status=$(curl -s -o /dev/null -w '%{http_code}' -A "$USER_AGENT" "$(endpoint "$1")") || true
              case "$status" in 200|404) break ;; esac
              echo "crates.io answered HTTP $status for $1 (attempt $attempt)" >&2
              sleep 10
            done
            echo "$status"
          }
          for crate in oxijolt-sys oxijolt; do
            status=$(status_of "$crate")
            case "$status" in
              404)
                cargo publish --locked --no-verify -p "$crate"
                ;;
              200)
                if [ "$crate" = oxijolt-sys ]; then
                  published="$RUNNER_TEMP/published.crate"
                  curl -fsSL --retry 3 -A "$USER_AGENT" -o "$published" "$(endpoint "$crate")/download"
                  if ! tar -xzOf "$published" "$crate-$CRATE_VERSION/prebuilt.txt" | cmp -s - "$LIST"; then
                    echo "$crate $CRATE_VERSION is on crates.io with another archive list; release a new version"
                    exit 1
                  fi
                fi
                echo "$crate $CRATE_VERSION is already on crates.io, skipped"
                ;;
              *)
                echo "crates.io check for $crate failed (HTTP $status)"
                exit 1
                ;;
            esac
          done
