[package]
name = "oxijolt-wasm-safe"
description = "Multi-call check of a safe-layer wasm32-unknown-unknown module, run in Node"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
oxijolt = { path = "../../crates/oxijolt" }

[features]
double-precision = ["oxijolt/double-precision"]
cross-platform-deterministic = ["oxijolt/cross-platform-deterministic"]
